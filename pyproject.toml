[project]
name = "hackatown"
version = "0.1.0"
description = ""
authors = [
    {name = "23Edu4rd0",email = "eduardo.vchaves23@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13, <4.0"
dependencies = [
    "numpy (>=2.4.2,<3.0.0)",
    "pandas (>=3.0.1,<4.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "fastapi[standard] (>=0.131.0,<0.132.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
